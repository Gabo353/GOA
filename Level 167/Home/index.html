<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
            
        }

        .card{
            width:350px;
            padding:25px;
            border-radius:20px;
            background:white;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            margin-bottom:20px;
            color:#333;
        }

        .search{
            display:flex;
            gap:10px;
            flex-direction: column;
        }

        input{
            flex:1;
            padding:12px;
            border:none;
            outline:none;
            border-radius:10px;
            background:#f2f2f2;
            font-size:16px;
        }

        button{
            padding:12px 18px;
            border:none;
            border-radius:10px;
            background:#4facfe;
            color:white;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#3295ff;
        }

        #result{
            margin-top:20px;
        }

        #result li{
            list-style:none;
            padding:10px;
            margin:8px 0;
            background:#f8f8f8;
            border-radius:10px;
            color:#333;
        }
    </style>
</head>
<body>


</body>
</html>
